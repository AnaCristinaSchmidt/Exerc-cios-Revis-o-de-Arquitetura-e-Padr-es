spring.application.name=sistema-vendas

# Banco H2 em memoria: nao precisa instalar nada, os dados somem ao reiniciar a aplicacao
spring.datasource.url=jdbc:h2:mem:sbornia;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas automaticamente a partir das entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2, util para inspecionar o banco em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
